[project]
name = "ingestion-engine"
version = "0.1.0"
description = "Stateless PDF -> CanonicalEdition ingestion pipeline (Goal 1: high-accuracy document extraction)"
requires-python = ">=3.13"
# LTS/stable pins: lower bound = the validated stable release, upper bound =
# the next minor/major so a surprise release can't silently change extraction
# output (which would break the content-address contract). Bump deliberately.
dependencies = [
    "docling>=2.111,<3",
    "fastapi>=0.139,<1",
    "jinja2>=3.1.6,<4",
    "latex2mathml>=3.78,<4",
    "lingua-language-detector>=2.2,<3",
    "pdfplumber>=0.11.4,<0.12",
    "pydantic>=2.13,<3",
    "pymupdf>=1.28,<2",
    "python-multipart>=0.0.32,<0.1",
    "pyyaml>=6.0.3,<7",
    "uvicorn[standard]>=0.51,<1",
]

# Opt-in model-backed corroborator engines (parser-consensus.md) are DELIBERATELY
# NOT listed as installable extras here: their dependency stacks are mutually
# incompatible AND incompatible with the base pipeline's `transformers` pin (via
# docling) -- UniMERNet 0.2.3 hard-pins transformers==4.42.4, Surya wants
# transformers>=4.51, docling resolves 5.8.x. Forcing them into this project's
# single lock resolution is unsatisfiable. They therefore run OUT-OF-PROCESS in
# their own environments and are reached by the graceful adapters in
# app/pipeline/engines/{mineru,surya}.py (see docs/references/ocr-engine-evaluation.md).
# The default build stays clean-licensed and light; the adapters report
# unavailable when their engine isn't reachable, so ingestion never hard-depends
# on them.

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pytest>=9.1,<10",
    "reportlab>=5.0,<6",
]
