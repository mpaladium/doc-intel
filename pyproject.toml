[project]
name = "ingestion-engine"
version = "0.1.0"
description = "Stateless PDF -> CanonicalEdition ingestion pipeline (Goal 1: high-accuracy document extraction)"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.97",
    "fastapi>=0.136",
    "jinja2>=3.1.6",
    "pydantic>=2",
    "pymupdf>=1.28.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.0",
]
