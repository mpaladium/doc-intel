# OWNERSHIP — element-type -> extractor priority (AGENTS.md §1.11: ownership, never voting).
#
# build order step 2 (ARCHITECTURE.md §7): SCANNED/UNCERTAIN pages route their
# `text` ownership to Docling's built-in RapidOCR (offline, already bundled --
# see app/pipeline/assemble.py's triage-driven ocr_enabled routing), gated by
# INGESTION_OCR (default on). Surya/MinerU remain the documented, heavier
# TECHSTACK.md swap-in for this row if RapidOCR's accuracy proves insufficient
# on a real scanned corpus -- a config change here, never a call-site special
# case. `layout`/`table`/`equation` stay Docling-owned regardless of OCR:
# Docling remains the sole geometry owner (AGENTS.md §1.10) even when the text
# inside a region comes from OCR instead of the digital text layer.
version: "0.2"

owners:
  layout:
    DIGITAL_CLEAN: [docling]
    DIGITAL_DIRTY: [docling]
    SCANNED: [docling]
    UNCERTAIN: [docling]

  table:
    DIGITAL_CLEAN: [docling]
    DIGITAL_DIRTY: [docling]
    SCANNED: [docling]
    UNCERTAIN: [docling]

  equation:
    # Docling's CodeFormula enrichment emits valid structured LaTeX (verified:
    # real subscripts, \text, \times, fractions -- NOT the flattened garble the
    # reference's "never accept Docling equations" note assumed, which predates
    # formula enrichment). So Docling OWNS the equation lane here. GLM-OCR and
    # MinerU/UniMERNet are now LIVE (opt-in) CORROBORATORS: each contributes an
    # independent LaTeX candidate for equation consensus (assemble._apply_equation
    # _corroboration), and a disagreement quarantines the equation with all
    # candidates kept -- they cross-check Docling, they never replace it.
    DIGITAL_CLEAN: [docling]
    DIGITAL_DIRTY: [docling]
    SCANNED: [docling]
    UNCERTAIN: [docling]

  text:
    DIGITAL_CLEAN: [digital_layer]
    DIGITAL_DIRTY: [docling]
    SCANNED: [rapidocr]
    UNCERTAIN: [rapidocr]
